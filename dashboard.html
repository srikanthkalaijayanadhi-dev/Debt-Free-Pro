<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - Debt Free Pro</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .dashboard-content {
            animation: fadeIn 0.5s ease-out;
        }

        /* 19 Widgets Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: var(--spacing-md);
            margin-top: var(--spacing-lg);
        }

        .metric-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .metric-title {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .metric-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .metric-highlight { color: var(--primary); }
        .metric-danger { color: var(--danger); }
        .metric-success { color: var(--secondary); }
        .metric-accent { color: var(--accent); }

        .ai-advisor-panel {
            background: linear-gradient(145deg, rgba(0, 82, 255, 0.05), rgba(0, 200, 83, 0.05));
            border-left: 4px solid var(--primary);
            padding: var(--spacing-lg);
            border-radius: var(--radius-md);
            margin-top: var(--spacing-xl);
        }

        .ai-advisor-panel h3 {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: var(--spacing-md);
        }

        .ai-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ai-list li {
            position: relative;
            padding-left: 20px;
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .ai-list li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--primary);
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">Debt Free <span class="text-gradient">Pro</span></div>
            </div>
            
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="dashboard.html" class="nav-link active">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                        Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="income.html" class="nav-link">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                        Income
                    </a>
                </li>
                <li class="nav-item">
                    <a href="expenses.html" class="nav-link">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M11 15h2v2h-2zm0-8h2v6h-2zm.99-5C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/></svg>
                        Expenses
                    </a>
                </li>
                <li class="nav-item">
                    <a href="loans.html" class="nav-link">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M11.5 1L2 6v2h19V6l-9.5-5zM5 22h14v-2H5v2zm7-11c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                        Loans
                    </a>
                </li>
                <li class="nav-item">
                    <a href="reports.html" class="nav-link">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
                        Reports
                    </a>
                </li>
                <li class="nav-item" style="margin-top: 40px;">
                    <a href="#" class="nav-link" onclick="logout()">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                        Logout
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
                <h1 class="topbar-title">Overview</h1>
                
                <div class="topbar-actions">
                    <label class="switch" style="display: flex; align-items: center; gap: 8px;">
                        <span style="font-size: 0.8rem; color: var(--text-secondary);">Dark</span>
                        <input type="checkbox" id="themeToggle" style="margin-top:2px;">
                    </label>
                    <div class="user-profile">
                        <div class="user-avatar" id="userInitial">S</div>
                        <span class="user-name" id="userName">User</span>
                    </div>
                </div>
            </header>

            <div class="dashboard-content animate-slide-up">
                
                <!-- 19 Requested Default Widgets -->
                <div class="metrics-grid" id="metricsGrid">
                    <!-- Populated by JS -->
                    <p style="color: var(--text-secondary);">Analyzing your financial data...</p>
                </div>

                <!-- AI Financial Advisor -->
                <div class="ai-advisor-panel">
                    <h3>
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
                        AI Financial Advisor
                    </h3>
                    <ul class="ai-list" id="aiRecommendations">
                        <li>Loading recommendations...</li>
                    </ul>
                </div>
                
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="supabase/config.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="supabase/database.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!window.supabaseClient) return;

            const { data: { session } } = await window.supabaseClient.auth.getSession();
            if (!session) return;

            const userId = session.user.id;

            try {
                // Fetch Profile
                const { data: profile, error: profileError } = await window.supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('id', userId)
                    .maybeSingle();

                if (profileError) throw profileError;

                // Fetch Loans
                const { data: loans, error: loansError } = await window.supabaseClient
                    .from('loans')
                    .select('*')
                    .eq('user_id', userId);

                if (loansError) throw loansError;

                // Fetch Expenses
                const { data: expenses, error: expensesError } = await window.supabaseClient
                    .from('expenses')
                    .select('*')
                    .eq('user_id', userId);

                if (expensesError) throw expensesError;

                if (profile && loans && expenses) {
                    calculateAndRender(profile, loans, expenses);
                } else {
                    document.getElementById('metricsGrid').innerHTML = '<p style="color: var(--text-secondary);">Waiting for initial data seed to complete. Please refresh...</p>';
                }

            } catch (error) {
                console.error('Error fetching dashboard data:', error);
                document.getElementById('metricsGrid').innerHTML = `<div style="grid-column: 1/-1; padding: 20px; border: 1px solid var(--danger); border-radius: 8px; color: var(--danger); background: rgba(255,59,48,0.1);"><strong>Database Error:</strong> ${error.message} <br><br>Have you run the <b>schema.sql</b> script in your Supabase SQL Editor yet?</div>`;
            }
        });

        function calculateAndRender(profile, loans, expenses) {
            // 1. Convert Loans
            let monthlyLoanPayments = 0;
            let dailyLoanPayments = 0;
            let totalActiveLoans = 0;
            let highestDailyLoan = null;

            let totalOutstandingDebt = 0;
            let totalOriginalAmount = 0;
            let totalAmountPaid = 0;

            let homeLoan = null;
            let goldLoan = null;
            let bharatPeLoan = null;
            let pandiyanLoan = null;

            loans.forEach(loan => {
                if (loan.status === 'Active') {
                    totalActiveLoans++;
                    let amt = Number(loan.emi_amount) || 0;
                    
                    let original = Number(loan.original_amount) || 0;
                    let outstanding = Number(loan.outstanding_balance) || 0;
                    let paid = Number(loan.amount_paid) || 0;
                    let down = Number(loan.down_payment) || 0;
                    let monthsPaid = Number(loan.months_paid) || 0;

                    // Fallback calculations for the UI display
                    if (original > 0 && outstanding === 0 && (paid > 0 || (monthsPaid > 0 && amt > 0))) {
                        let totalPaid = paid + down + (monthsPaid * amt);
                        outstanding = original - totalPaid;
                    }

                    // For AI and Progress
                    if (loan.name.includes('Home Loan')) homeLoan = { ...loan, outstanding };
                    if (loan.name.includes('Gold Loan')) goldLoan = { ...loan, outstanding };
                    if (loan.name.includes('BharatPe')) bharatPeLoan = { ...loan, outstanding };
                    if (loan.name.includes('Pandiyan')) pandiyanLoan = { ...loan, outstanding };

                    totalOutstandingDebt += outstanding;
                    totalOriginalAmount += original;
                    
                    // Track amount paid
                    let currentLoanPaid = paid + down;
                    if (paid === 0 && monthsPaid > 0) currentLoanPaid += (monthsPaid * amt);
                    totalAmountPaid += currentLoanPaid;

                    if (loan.type === 'daily') {
                        dailyLoanPayments += amt;
                        monthlyLoanPayments += (amt * 30);
                        
                        if (!highestDailyLoan || amt > Number(highestDailyLoan.emi_amount)) {
                            highestDailyLoan = loan;
                        }
                    } else {
                        monthlyLoanPayments += amt;
                    }
                }
            });

            // 2. Convert Expenses
            let monthlyExpenses = 0;
            let todayExpense = 0;

            expenses.forEach(exp => {
                let amt = Number(exp.amount);
                if (exp.category === 'Daily Expenses' || exp.notes?.includes('Daily')) {
                    todayExpense += amt;
                    monthlyExpenses += (amt * 30);
                } else {
                    monthlyExpenses += amt;
                }
            });

            // 3. Profile Data
            const monthlyIncome = Number(profile.monthly_income) || 0;

            // 4. Derived Calculations
            const totalMonthlyOutflow = monthlyExpenses + monthlyLoanPayments;
            const remainingMonthlyCash = monthlyIncome > 0 ? (monthlyIncome - totalMonthlyOutflow) : 0; 
            const cashFlow = monthlyIncome > 0 ? remainingMonthlyCash : -totalMonthlyOutflow;
            
            const debtRatio = monthlyIncome > 0 ? ((monthlyLoanPayments / monthlyIncome) * 100).toFixed(1) : 0;
            const savingsRatio = monthlyIncome > 0 ? ((remainingMonthlyCash / monthlyIncome) * 100).toFixed(1) : 0;
            
            // Health Score: Base 100 - (DebtRatio) + Savings Ratio/2
            let financialHealthScore = 100 - Number(debtRatio) + (Number(savingsRatio)/2);
            if (monthlyIncome === 0) financialHealthScore = 40; // Default for missing income
            financialHealthScore = Math.max(0, Math.min(100, financialHealthScore)).toFixed(0);

            // Progress Calculations
            const calcProgress = (loan) => loan && loan.original_amount > 0 ? (((loan.original_amount - loan.outstanding) / loan.original_amount) * 100).toFixed(1) + '%' : '0%';
            
            let homeLoanProgress = calcProgress(homeLoan);
            let goldLoanProgress = calcProgress(goldLoan);
            let bharatPeProgress = calcProgress(bharatPeLoan);
            let pandiyanProgress = calcProgress(pandiyanLoan);
            let totalDebtFreeProgress = totalOriginalAmount > 0 ? ((totalOriginalAmount - totalOutstandingDebt) / totalOriginalAmount * 100).toFixed(1) + '%' : '0%';

            // Render Widgets
            const metrics = [
                { title: "Total Outstanding Debt", value: formatCurrency(totalOutstandingDebt), class: "metric-danger" },
                { title: "Total Amount Already Paid", value: formatCurrency(totalAmountPaid), class: "metric-success" },
                { title: "Remaining Loan Balance", value: formatCurrency(totalOutstandingDebt), class: "metric-danger" },
                { title: "Home Loan Progress", value: homeLoanProgress, class: "metric-highlight" },
                { title: "Gold Loan Status", value: goldLoanProgress, class: "metric-highlight" },
                { title: "BharatPe Progress", value: bharatPeProgress, class: "metric-highlight" },
                { title: "Pandiyan Finance Progress", value: pandiyanProgress, class: "metric-highlight" },
                { title: "Today's Total Daily Payment", value: formatCurrency(dailyLoanPayments), class: "metric-accent" },
                { title: "Monthly EMI Total", value: formatCurrency(monthlyLoanPayments), class: "metric-danger" },
                { title: "Financial Health Score", value: financialHealthScore + "/100", class: "metric-highlight" },
                { title: "Debt-Free Progress", value: totalDebtFreeProgress, class: "metric-success" },
                { title: "Monthly Cash Flow", value: formatCurrency(cashFlow), class: cashFlow >= 0 ? "metric-success" : "metric-danger" },
                { title: "High Priority Loans", value: loans.filter(l => l.priority === 'Very High' || l.priority === 'High').length, class: "metric-danger" }
            ];

            const grid = document.getElementById('metricsGrid');
            grid.innerHTML = metrics.map(m => `
                <div class="metric-card">
                    <div class="metric-title">${m.title}</div>
                    <div class="metric-value ${m.class}">${m.value}</div>
                </div>
            `).join('');

            // Render AI Advisor
            const aiList = document.getElementById('aiRecommendations');
            let estimatedMonths = totalOutstandingDebt / (monthlyLoanPayments || 1);
            let targetDate = new Date();
            targetDate.setMonth(targetDate.getMonth() + estimatedMonths);

            let warnings = [];
            
            // AI Recommendations:
            // 1. Which loan should be closed first
            if (highestDailyLoan) {
                warnings.push(`<strong>${highestDailyLoan.name}</strong> costs the most daily (${formatCurrency(highestDailyLoan.emi_amount)}/day) and should be closed first. Closing this frees up ${formatCurrency(highestDailyLoan.emi_amount * 30)} every month.`);
            }

            // 2. Highest financial burden
            let highestBurdenLoan = loans.reduce((max, loan) => (Number(loan.outstanding_balance) > Number(max.outstanding_balance) ? loan : max), loans[0]);
            if (highestBurdenLoan) {
                warnings.push(`<strong>${highestBurdenLoan.name}</strong> has the highest overall financial burden (${formatCurrency(highestBurdenLoan.outstanding_balance)} outstanding).`);
            }

            // 3. Most expensive monthly
            let highestMonthlyEmi = loans.reduce((max, loan) => {
                let monthlyCost = loan.type === 'daily' ? Number(loan.emi_amount) * 30 : Number(loan.emi_amount);
                let maxCost = max.type === 'daily' ? Number(max.emi_amount) * 30 : Number(max.emi_amount);
                return monthlyCost > maxCost ? loan : max;
            }, loans[0]);
            
            if (highestMonthlyEmi) {
                let monthlyCost = highestMonthlyEmi.type === 'daily' ? Number(highestMonthlyEmi.emi_amount) * 30 : Number(highestMonthlyEmi.emi_amount);
                warnings.push(`<strong>${highestMonthlyEmi.name}</strong> costs the most every month at ${formatCurrency(monthlyCost)}.`);
            }

            // 4. Extra payment / Savings required
            if (cashFlow < 0 && monthlyIncome > 0) {
                warnings.push(`You currently have a negative cash flow. You need to reduce your spending by at least <strong>${formatCurrency(Math.abs(cashFlow))}</strong> just to break even.`);
            } else if (cashFlow > 0) {
                warnings.push(`Adding an extra payment of <strong>${formatCurrency(cashFlow * 0.5)}</strong> (50% of your cash flow) towards your highest priority loan will significantly reduce your debt timeline.`);
                
                let fastMonths = totalOutstandingDebt / (monthlyLoanPayments + (cashFlow * 0.5));
                warnings.push(`By doing this, you can become completely debt-free ${Math.ceil(estimatedMonths - fastMonths)} months sooner!`);
            }

            // 5. Estimated debt-free date
            if (estimatedMonths < 1200) {
                warnings.push(`At your current rate, your estimated debt-free date is <strong>${targetDate.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' })}</strong>.`);
            }

            // 6. Spending reduction suggestions
            if (todayExpense > 1500) {
                warnings.push(`Your average daily expense (${formatCurrency(todayExpense)}) is very high. Cutting this by 30% will instantly generate ${formatCurrency(todayExpense * 0.3 * 30)} in extra monthly savings.`);
            }

            aiList.innerHTML = warnings.map(w => `<li>${w}</li>`).join('');
        }
    </script>
</body>
</html>
