<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Expenses - Debt Free Pro</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .page-content { animation: fadeIn 0.5s ease-out; }
        
        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: var(--spacing-lg);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        
        th {
            padding: 12px 16px;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border-color);
        }
        
        td {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 0.95rem;
        }
        
        .badge {
            padding: 4px 10px;
            border-radius: var(--radius-pill);
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(255, 145, 0, 0.1);
            color: var(--accent);
        }

        .filter-bar {
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
            flex-wrap: wrap;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity var(--transition-fast);
        }
        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }
        .modal-card {
            width: 100%;
            max-width: 500px;
            margin: var(--spacing-md);
            transform: scale(0.95);
            transition: transform var(--transition-fast);
        }
        .modal-overlay.active .modal-card {
            transform: scale(1);
        }
    </style>
</head>
<body>
    <div class="app-container">
        
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">Debt Free <span class="text-gradient">Pro</span></div>
            </div>
            
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="dashboard.html" class="nav-link">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                        Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="income.html" class="nav-link">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                        Income
                    </a>
                </li>
                <li class="nav-item">
                    <a href="expenses.html" class="nav-link active">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M11 15h2v2h-2zm0-8h2v6h-2zm.99-5C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/></svg>
                        Expenses
                    </a>
                </li>
                <li class="nav-item">
                    <a href="loans.html" class="nav-link">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M11.5 1L2 6v2h19V6l-9.5-5zM5 22h14v-2H5v2zm7-11c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                        Loans
                    </a>
                </li>
                <li class="nav-item">
                    <a href="reports.html" class="nav-link">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
                        Reports
                    </a>
                </li>
                <li class="nav-item" style="margin-top: 40px;">
                    <a href="#" class="nav-link" onclick="logout()">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                        Logout
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
                <h1 class="topbar-title">Expense Tracker</h1>
                
                <div class="topbar-actions">
                    <button class="btn btn-secondary" id="addExpenseBtn">+ Add Expense</button>
                </div>
            </header>

            <div class="page-content">
                <div class="glass-card">
                    <div class="filter-bar">
                        <input type="text" class="form-input" placeholder="Search expenses..." style="max-width: 250px;" id="searchInput">
                        <select class="form-input" style="max-width: 200px;" id="categoryFilter">
                            <option value="">All Categories</option>
                            <option value="Food">Food</option>
                            <option value="Fuel">Fuel</option>
                            <option value="Inventory">Inventory</option>
                            <option value="Business">Business</option>
                            <option value="Transport">Transport</option>
                            <option value="Salary">Salary</option>
                            <option value="Medical">Medical</option>
                            <option value="Family">Family</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Category</th>
                                    <th>Notes</th>
                                    <th>Amount</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="expenseTableBody">
                                <!-- Data populated via JS -->
                                <tr><td colspan="5" style="text-align:center;">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Expense Modal -->
    <div class="modal-overlay" id="expenseModal">
        <div class="glass-card modal-card">
            <h2 style="margin-bottom: var(--spacing-lg);">Add New Expense</h2>
            <form id="expenseForm">
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <select class="form-input" id="expenseCategory" required>
                        <option value="Food">Food</option>
                        <option value="Fuel">Fuel</option>
                        <option value="Inventory">Inventory</option>
                        <option value="Business">Business</option>
                        <option value="Transport">Transport</option>
                        <option value="Salary">Salary</option>
                        <option value="Medical">Medical</option>
                        <option value="Family">Family</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Electricity">Electricity</option>
                        <option value="Gas">Gas</option>
                        <option value="Mobile & Internet">Mobile & Internet</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Amount (₹)</label>
                    <input type="number" class="form-input" id="expenseAmount" required min="1">
                </div>
                <div class="form-group">
                    <label class="form-label">Date</label>
                    <input type="date" class="form-input" id="expenseDate" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Notes / Description</label>
                    <input type="text" class="form-input" id="expenseNotes" placeholder="Optional notes">
                </div>
                
                <div style="display: flex; gap: var(--spacing-md); margin-top: var(--spacing-xl);">
                    <button type="button" class="btn btn-outline" style="flex:1;" id="cancelModalBtn">Cancel</button>
                    <button type="submit" class="btn btn-secondary" style="flex:1;">Save Expense</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="supabase/config.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Set today's date as default
            document.getElementById('expenseDate').valueAsDate = new Date();

            const modal = document.getElementById('expenseModal');
            document.getElementById('addExpenseBtn').addEventListener('click', () => modal.classList.add('active'));
            document.getElementById('cancelModalBtn').addEventListener('click', () => modal.classList.remove('active'));

            await fetchExpenses();

            // Handle Form Submit
            document.getElementById('expenseForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!window.supabaseClient) {
                    alert('Supabase not configured.');
                    return;
                }

                const { data: { session } } = await window.supabaseClient.auth.getSession();
                
                const newExpense = {
                    user_id: session.user.id,
                    category: document.getElementById('expenseCategory').value,
                    amount: document.getElementById('expenseAmount').value,
                    date: document.getElementById('expenseDate').value,
                    notes: document.getElementById('expenseNotes').value
                };

                const { error } = await window.supabaseClient.from('expenses').insert([newExpense]);
                
                if (error) {
                    alert(error.message);
                } else {
                    modal.classList.remove('active');
                    document.getElementById('expenseForm').reset();
                    fetchExpenses();
                }
            });
        });

        async function fetchExpenses() {
            const tbody = document.getElementById('expenseTableBody');
            
            if (!window.supabaseClient) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Database not connected</td></tr>';
                return;
            }

            const { data: { session } } = await window.supabaseClient.auth.getSession();
            if (!session) return;

            const { data, error } = await window.supabaseClient
                .from('expenses')
                .select('*')
                .eq('user_id', session.user.id)
                .order('date', { ascending: false });

            if (error) {
                console.error(error);
                return;
            }

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color: var(--text-secondary);">No expense records found. Add one to get started!</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(exp => `
                <tr>
                    <td>${new Date(exp.date).toLocaleDateString()}</td>
                    <td><span class="badge">${exp.category}</span></td>
                    <td style="color: var(--text-secondary);">${exp.notes || '-'}</td>
                    <td style="font-weight: 600; color: var(--danger);">${formatCurrency(exp.amount)}</td>
                    <td>
                        <button class="btn btn-outline" style="padding: 4px 8px; font-size: 0.8rem;" onclick="deleteExpense('${exp.id}')">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        window.deleteExpense = async (id) => {
            if (confirm('Are you sure you want to delete this record?')) {
                await window.supabaseClient.from('expenses').delete().eq('id', id);
                fetchExpenses();
            }
        };
    </script>
</body>
</html>
