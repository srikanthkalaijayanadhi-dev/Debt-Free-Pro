<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calendar - Debt Free Pro</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .page-content { animation: fadeIn 0.5s ease-out; }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: var(--border-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            overflow: hidden;
            margin-top: var(--spacing-lg);
        }

        .calendar-header {
            background: var(--surface-color);
            padding: 12px;
            text-align: center;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .calendar-day {
            background: var(--bg-color);
            min-height: 100px;
            padding: 8px;
            transition: background var(--transition-fast);
        }

        .calendar-day:hover {
            background: var(--surface-color);
        }

        .calendar-date {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .calendar-event {
            font-size: 0.75rem;
            padding: 4px;
            border-radius: 4px;
            margin-bottom: 4px;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .event-emi { background: var(--danger); }
        .event-bill { background: var(--accent); }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">Debt Free <span class="text-gradient">Pro</span></div>
            </div>
            
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="dashboard.html" class="nav-link">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                        Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="income.html" class="nav-link">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                        Income
                    </a>
                </li>
                <li class="nav-item">
                    <a href="expenses.html" class="nav-link">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M11 15h2v2h-2zm0-8h2v6h-2zm.99-5C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/></svg>
                        Expenses
                    </a>
                </li>
                <li class="nav-item">
                    <a href="loans.html" class="nav-link">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M11.5 1L2 6v2h19V6l-9.5-5zM5 22h14v-2H5v2zm7-11c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                        Loans
                    </a>
                </li>
                <li class="nav-item">
                    <a href="reports.html" class="nav-link">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
                        Reports
                    </a>
                </li>
                <li class="nav-item" style="margin-top: 40px;">
                    <a href="#" class="nav-link" onclick="logout()">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                        Logout
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
                <h1 class="topbar-title">Financial Calendar</h1>
            </header>

            <div class="page-content">
                <div class="glass-card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-md);">
                        <h2>June 2026</h2>
                        <div>
                            <button class="btn btn-outline" style="padding: 4px 12px;">&lt; Prev</button>
                            <button class="btn btn-outline" style="padding: 4px 12px;">Next &gt;</button>
                        </div>
                    </div>

                    <div class="calendar-grid" id="calendarGrid">
                        <!-- Headers -->
                        <div class="calendar-header">Sun</div>
                        <div class="calendar-header">Mon</div>
                        <div class="calendar-header">Tue</div>
                        <div class="calendar-header">Wed</div>
                        <div class="calendar-header">Thu</div>
                        <div class="calendar-header">Fri</div>
                        <div class="calendar-header">Sat</div>
                        
                        <!-- Days (Populated by JS) -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="supabase/config.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('calendarGrid');
            
            // Hardcoded month view for UI demonstration
            for (let i = 1; i <= 30; i++) {
                let eventsHTML = '';
                
                // Simulate some events
                if (i === 1) eventsHTML += '<div class="calendar-event event-emi">Home Loan EMI</div>';
                if (i === 5) eventsHTML += '<div class="calendar-event event-emi">Dad EMI</div>';
                if (i === 10) eventsHTML += '<div class="calendar-event event-bill">Electricity Bill</div>';
                if (i === 15) eventsHTML += '<div class="calendar-event event-bill">Gas Bill</div>';
                if (i === 28) eventsHTML += '<div class="calendar-event event-emi">Personal EMI</div>';

                grid.innerHTML += `
                    <div class="calendar-day">
                        <div class="calendar-date">${i}</div>
                        ${eventsHTML}
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
