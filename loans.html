<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loans & EMI - Debt Free Pro</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .page-content { animation: fadeIn 0.5s ease-out; }
        
        .loan-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: var(--spacing-lg);
            margin-top: var(--spacing-lg);
        }

        .loan-card {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .loan-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .loan-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .badge {
            padding: 4px 10px;
            border-radius: var(--radius-pill);
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-daily { background: rgba(255, 145, 0, 0.1); color: var(--accent); }
        .badge-monthly { background: rgba(0, 82, 255, 0.1); color: var(--primary); }

        .loan-emi {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--danger);
            margin-top: var(--spacing-xs);
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: var(--border-color);
            border-radius: var(--radius-pill);
            overflow: hidden;
            margin-top: var(--spacing-sm);
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--secondary);
            border-radius: var(--radius-pill);
        }

    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">Debt Free <span class="text-gradient">Pro</span></div>
            </div>
            
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="dashboard.html" class="nav-link">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                        Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="income.html" class="nav-link">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                        Income
                    </a>
                </li>
                <li class="nav-item">
                    <a href="expenses.html" class="nav-link">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M11 15h2v2h-2zm0-8h2v6h-2zm.99-5C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/></svg>
                        Expenses
                    </a>
                </li>
                <li class="nav-item">
                    <a href="loans.html" class="nav-link active">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M11.5 1L2 6v2h19V6l-9.5-5zM5 22h14v-2H5v2zm7-11c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                        Loans
                    </a>
                </li>
                <li class="nav-item">
                    <a href="reports.html" class="nav-link">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
                        Reports
                    </a>
                </li>
                <li class="nav-item" style="margin-top: 40px;">
                    <a href="#" class="nav-link" onclick="logout()">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                        Logout
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
                <h1 class="topbar-title">Loans & EMI Tracker</h1>
                
                <div class="topbar-actions">
                    <button class="btn btn-primary" id="addLoanBtn">+ Add Loan</button>
                    <div class="user-profile">
                        <div class="user-avatar" id="userInitial">S</div>
                        <span class="user-name" id="userName">User</span>
                    </div>
                </div>
            </header>

            <div class="page-content">
                <div id="loanList" class="loan-grid">
                    <p style="color: var(--text-secondary);">Loading loans...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Loan Modal -->
    <div class="modal-overlay" id="loanModal">
        <div class="glass-card modal-card">
            <h2 id="modalTitle" style="margin-bottom: var(--spacing-lg);">Add New Loan</h2>
            <form id="loanForm">
                <input type="hidden" id="loanId">
                <div class="form-group">
                    <label class="form-label">Loan Name</label>
                    <input type="text" class="form-input" id="loanName" required placeholder="e.g. Personal Loan">
                </div>
                <div class="form-group">
                    <label class="form-label">EMI Type</label>
                    <select class="form-input" id="loanType" required>
                        <option value="monthly">Monthly</option>
                        <option value="daily">Daily Finance</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">EMI Amount (₹)</label>
                    <input type="number" class="form-input" id="loanEmi" required min="1">
                </div>
                <div class="form-group">
                    <label class="form-label">Principal Amount / Total Loan (Optional)</label>
                    <input type="number" class="form-input" id="loanPrincipal" placeholder="Total loan taken">
                </div>
                <div class="form-group">
                    <label class="form-label">Priority</label>
                    <select class="form-input" id="loanPriority">
                        <option value="High">High (Pay ASAP)</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </div>
                
                <div style="display: flex; gap: var(--spacing-md); margin-top: var(--spacing-xl);">
                    <button type="button" class="btn btn-outline" style="flex:1;" id="cancelModalBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary" style="flex:1;">Save Loan</button>
                </div>
            </form>
        </div>
    </div>

    <script src="supabase/config.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const modal = document.getElementById('loanModal');
            document.getElementById('addLoanBtn').addEventListener('click', () => {
                document.getElementById('loanForm').reset();
                document.getElementById('loanId').value = '';
                document.getElementById('modalTitle').textContent = 'Add New Loan';
                modal.classList.add('active');
            });
            document.getElementById('cancelModalBtn').addEventListener('click', () => modal.classList.remove('active'));

            await fetchLoans();

            // Handle Form Submit
            document.getElementById('loanForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!window.supabaseClient) return alert('Supabase not configured.');

                const { data: { session } } = await window.supabaseClient.auth.getSession();
                
                const loanId = document.getElementById('loanId').value;
                const loanData = {
                    user_id: session.user.id,
                    name: document.getElementById('loanName').value,
                    type: document.getElementById('loanType').value,
                    emi_amount: document.getElementById('loanEmi').value,
                    principal_amount: document.getElementById('loanPrincipal').value || 0,
                    priority: document.getElementById('loanPriority').value,
                    status: 'Active'
                };

                let error;
                if (loanId) {
                    const res = await window.supabaseClient.from('loans').update(loanData).eq('id', loanId);
                    error = res.error;
                } else {
                    const res = await window.supabaseClient.from('loans').insert([loanData]);
                    error = res.error;
                }
                
                if (error) {
                    alert(error.message);
                } else {
                    modal.classList.remove('active');
                    document.getElementById('loanForm').reset();
                    document.getElementById('loanId').value = '';
                    document.getElementById('modalTitle').textContent = 'Add New Loan';
                    fetchLoans();
                }
            });
        });

        async function fetchLoans() {
            const container = document.getElementById('loanList');
            
            if (!window.supabaseClient) {
                container.innerHTML = '<p>Database not connected</p>';
                return;
            }

            const { data: { session } } = await window.supabaseClient.auth.getSession();
            if (!session) return;

            const { data, error } = await window.supabaseClient
                .from('loans')
                .select('*')
                .eq('user_id', session.user.id)
                .order('priority', { ascending: true }); // High -> Low

            if (error) {
                console.error(error);
                container.innerHTML = `<p style="color: var(--danger); width: 100%;">Database Error: ${error.message} <br><br>Did you run schema.sql?</p>`;
                return;
            }

            if (data.length === 0) {
                container.innerHTML = '<p style="color: var(--text-secondary); width: 100%;">No loans found. Good job!</p>';
                return;
            }

            container.innerHTML = data.map(loan => {
                const isDaily = loan.type === 'daily';
                const badgeClass = isDaily ? 'badge-daily' : 'badge-monthly';
                const typeText = isDaily ? 'Daily' : 'Monthly';
                const periodText = isDaily ? '/ day' : '/ month';
                
                return `
                <div class="glass-card loan-card">
                    <div class="loan-header">
                        <div class="loan-title">${loan.name}</div>
                        <div class="badge ${badgeClass}">${typeText}</div>
                    </div>
                    <div class="loan-emi">
                        ${formatCurrency(loan.emi_amount)} <span style="font-size: 0.8rem; font-weight: 500; color: var(--text-secondary);">${periodText}</span>
                    </div>
                    
                    <div style="margin-top: var(--spacing-sm); font-size: 0.85rem; color: var(--text-secondary);">
                        Priority: <strong style="color: ${loan.priority === 'High' ? 'var(--danger)' : 'inherit'}">${loan.priority}</strong>
                    </div>

                    ${loan.principal_amount > 0 ? `
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" style="width: 15%;"></div>
                        </div>
                        <div style="display:flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-secondary); margin-top: 4px;">
                            <span>Principal: ${formatCurrency(loan.principal_amount)}</span>
                            <span>Est. 15% Paid</span>
                        </div>
                    ` : ''}

                    <div style="margin-top: auto; padding-top: var(--spacing-md); display: flex; gap: 8px;">
                        <button class="btn btn-outline" style="flex:1; padding: 6px; font-size: 0.85rem;" onclick="logPayment('${loan.id}', ${loan.emi_amount})">Mark Paid</button>
                        <button class="btn btn-outline" style="padding: 6px; font-size: 0.85rem;" onclick="editLoan('${loan.id}')">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                        </button>
                        <button class="btn btn-outline" style="padding: 6px; font-size: 0.85rem;" onclick="deleteLoan('${loan.id}')">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                    </div>
                </div>
            `}).join('');
        }

        window.editLoan = async (id) => {
            if (!window.supabaseClient) return;
            const { data, error } = await window.supabaseClient.from('loans').select('*').eq('id', id).single();
            if (error) {
                alert(error.message);
                return;
            }
            
            document.getElementById('loanId').value = data.id;
            document.getElementById('loanName').value = data.name;
            document.getElementById('loanType').value = data.type;
            document.getElementById('loanEmi').value = data.emi_amount;
            document.getElementById('loanPrincipal').value = data.principal_amount;
            document.getElementById('loanPriority').value = data.priority;
            
            document.getElementById('modalTitle').textContent = 'Edit Loan';
            document.getElementById('loanModal').classList.add('active');
        };

        window.deleteLoan = async (id) => {
            if (confirm('Are you sure you want to delete this loan?')) {
                await window.supabaseClient.from('loans').delete().eq('id', id);
                fetchLoans();
            }
        };

        window.logPayment = async (loanId, amount) => {
            if (!window.supabaseClient) return;
            const { data: { session } } = await window.supabaseClient.auth.getSession();
            
            const { error } = await window.supabaseClient.from('daily_finance_logs').insert([{
                user_id: session.user.id,
                loan_id: loanId,
                amount_paid: amount
            }]);

            if (error) {
                alert('Error logging payment: ' + error.message);
            } else {
                alert('Payment logged successfully!');
            }
        }
    </script>
</body>
</html>
